async function pick(){const all=QS(),age=new Map();PL.forEach(p=>(p.seen||[]).forEach((h,i,a)=>{const g=a.length-i;age.set(h,Math.min(age.has(h)?age.get(h):1e9,g))}));

G.ord=[...fr,...old].slice(0,n);await gd().update({ord:G.ord});startRound(0)}
async function startRound(r){const q=QS()[G.ord[r]];await Promise.all(PL.map(p=>pc().doc(p.id).update({fake:p.bot?q.d[Math.random()*q.d.length|0]:'',vote:-1,steal:false,blocked:false})));

async function toVote(){if(busy)return;busy=true;const q=QS()[G.ord[G.round]],m={};PL.forEach(p=>{const k=(p.fake||'').toLowerCase();if(!k)return;(m[k]=m[k]||{t:p.fake,by:[],truth:false}).by.push(p.id)});
const opts=shuf([...Object.values(m),{t:q.a,by:[],truth:true}]);
for(const p of PL.filter(p=>p.bot)){const ti=opts.findIndex(o=>o.truth);let v;if(Math.random()<.7)v=ti;else{const c=opts.map((o,i)=>i).filter(i=>i!==ti&&!opts[i].by.includes(p.id));v=c.length?c[Math.random()*c.length|0]:ti}await pc().doc(p.id).update({vote:v})}
await gd().update({phase:'vote',opts});busy=false}
async function toReveal(){if(busy)return;busy=true;const add={},cnt=G.opts.map(()=>0);
PL.forEach(p=>{if(p.vote<0)return;const o=G.opts[p.vote];if(!o)return;cnt[p.vote]++;if(o.truth){if(!p.blocked)add[p.id]=(add[p.id]||0)+2}else o.by.forEach(id=>add[id]=(add[id]||0)+1)});
const st=PL.find(p=>p.steal&&!p.blocked);if(st){let bi=-1,bm=0;G.opts.forEach((o,i)=>{if(!o.truth&&cnt[i]>bm){bm=cnt[i];bi=i}});if(bi>=0){let g=0;G.opts[bi].by.forEach(id=>{if(id!==st.id){add[id]-=cnt[bi];g+=cnt[bi]}});add[st.id]=(add[st.id]||0)+g}}
for(const p of PL)if(add[p.id])await pc().doc(p.id).update({score:p.score+add[p.id]});await gd().update({phase:'reveal'});busy=false}
function tick(){if(!G||!isHost()||busy||!PL.length)return;const hs=humans();if(G.phase==='fake'&&hs.length&&hs.every(p=>p.fake))toVote();else if(G.phase==='vote'&&hs.length&&hs.every(p=>p.vote>=0))toReveal()}
