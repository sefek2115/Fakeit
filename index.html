USTAWIENIA FIREBASE (Firestore -> Rules), wklej i kliknij Publish:
rules_version = '2'; service cloud.firestore { match /databases/{d}/documents {
  match /users/{uid}/{doc=**} { allow read, write: if request.auth.uid == uid; }
  match /games/{g}/{doc=**} { allow read, write: if request.auth != null; }
  match /trades/{t} { allow read, write: if request.auth != null; }
  match /cardstats/{c} { allow read, write: if request.auth != null; }
  match /invites/{i} { allow read, write: if request.auth != null; }
  match /bgames/{g}/{doc=**} { allow read, write: if request.auth != null; }
  match /binv/{i} { allow read, write: if request.auth != null; }
  match /bhist/{i} { allow read, write: if request.auth != null; }
  match /hgames/{g}/{doc=**} { allow read, write: if request.auth != null; }
  match /leaderboard/{u} { allow read: if request.auth != null; allow write: if request.auth.uid == u; } } }
Pytania: pliki pytania-ogolne.txt (lub fake_it_ogolne_1000.txt), pytania-biologia.txt, pytania-geografia.txt, pytania-motoryzacja.txt obok index.html (format: Pytanie? -> Odpowiedź | fałszywa 1 | fałszywa 2 | fałszywa 3 | e:wyjaśnienie | img:nazwa).
Kategorie: wrzuć plik obok index.html, a gra sama go wczyta (min. 3 pytania). Nazwy plików: pytania-historia.txt, pytania-polska.txt, pytania-nauka.txt, pytania-kosmos.txt, pytania-technologia.txt, pytania-gry.txt, pytania-filmy.txt, pytania-muzyka.txt, pytania-ksiazki.txt, pytania-jedzenie.txt, pytania-zwierzeta.txt, pytania-przyroda.txt, pytania-sztuka.txt, pytania-mitologia.txt, pytania-internet.txt, pytania-szkola.txt, pytania-zdrowie.txt, pytania-jezyki.txt, pytania-matematyka.txt, pytania-moda.txt, pytania-podroze.txt (oraz biologia, geografia, motoryzacja, sport, ogolne). Własne kategorie: plik kategorie.txt (nazwa | plik1.txt | plik2.txt).
-->

const SHP=[30,75,180,450,1200],SHW=[48,28,15,7,2];
const shopWeek=()=>Math.floor((day(Date.now())-4)/7);
const shopHash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const shopRng=seed=>{let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}};
function shopOffers(){const r=shopRng(shopHash((P.id||'x')+':'+shopWeek())),out=[];let g=0;while(out.length<3&&g++<60){let x=r()*100,t=0;while(t<4&&x>=SHW[t]){x-=SHW[t];t++}const id=t*44+Math.floor(r()*44);if(!out.includes(id))out.push(id)}return out}
function weeklyCard(){const w=shopWeek();if(!P.sh||P.sh.w!==w)P.sh={w,b:[]};const nd=(w+1)*7+4-day(Date.now()),offs=shopOffers();
const item=id=>{const t=cd(id)[2],price=SHP[t],own=P.cards.filter(c=>c[0]===id).length,need=price-P.coins,done=P.sh.b.includes(id);
return `<div class="shi"><div class="shc">${ct(id)}</div><div class="sho${own?' y':''}">${own?'✅ Masz ×'+own:'Nie masz tej karty'}</div>${done?'<div class="shd">✔ Kupiono</div>':`<div class="shp">🪙 ${price}</div><div class="bar"><i style="width:${Math.min(100,P.coins/price*100)}%"></i></div><button class="shb" data-buy="${id}" ${need>0?'disabled':''}>${need>0?'Brakuje '+need+' 🪙':'Kup'}</button>`}</div>`};
return `<div class="c"><h3>🛍️ Karty tygodnia</h3><p>Trzy karty tylko dla Ciebie, każdy gracz ma inne. Oferta odnowi się w poniedziałek (za ${nd} ${nd===1?'dzień':'dni'}). Ceny zależą od rzadkości: ${TN.map((n,i)=>n+' '+SHP[i]).join(' · ')} 🪙. Każdą kartę możesz kupić raz na tydzień.</p><div class="shg">${offs.map(item).join('')}</div></div>`}
function bindWeekly(mn){mn.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const id=+b.dataset.buy,price=SHP[Math.floor(id/44)];if(P.sh.b.includes(id))return;if(P.coins<price)return toast('Za mało coinów');P.coins-=price;P.sh.b.push(id);addCard(id);chk();packAnim([id])})}

const GUIDE=[
{id:'menu',i:'🏠',t:'Menu główne',b:`<p>${gk('Co to:')} strona startowa. Na górze są trzy skróty: ⚙ (Profil i ustawienia), 🔔 (aktualizacje, kropka oznacza coś nowego) i moneta z plusem (Twoje coiny i skok do sklepu). Niżej: kafelki gier, karta „Gracze" (prowadzi do rankingu), karta „Tak trzymaj!" z serią dni, baner Kart tygodnia i skróty do osiągnięć oraz kolekcji.</p><p>${gk('Jak używać:')} dotknij kafelka gry, żeby w nią wejść. Z gry wracasz przyciskiem „← Gry".</p><p>${gk('Po co:')} wszystkie gry mają wspólne konto, coiny, karty, ramki i osiągnięcia, a menu to miejsce, z którego wszystko jest pod ręką.</p>`},

{id:'fakeit',i:'🎭',t:'Fake it: jak grać',b:`<p>${gk('Co to:')} gra w wymyślanie fałszywych odpowiedzi. Dostajesz pytanie, każdy wpisuje swoją odpowiedź, która ma wyglądać na prawdziwą, a potem wszyscy głosują, która jest prawdziwa.</p><p>${gk('Punkty:')} prawdziwa odpowiedź to +2. Za każdą osobę, która da się nabrać na Twój fejk, dostajesz +1. Nie możesz wpisać prawdziwej odpowiedzi, gra Cię o tym uprzedzi.</p><p>${gk('Jak zacząć:')} wejdź w Fake it i w zakładce Graj wybierz:</p><ul><li>${gk('Z botami:')} gra solo, do pokoju dochodzą 3 boty.</li><li>${gk('Ze znajomymi:')} tworzysz pokój z 3-cyfrowym kodem. Znajomi wpisują go w „Dołącz kodem". Start jest możliwy od 3 graczy (boty też się liczą).</li><li>${gk('Dołącz kodem:')} wpisujesz kod od znajomego.</li></ul><p>W ustawieniach gry wybierasz kategorię i liczbę rund (od 5 do 50). Po każdej rundzie przycisk „Wyjaśnij" pokazuje wyjaśnienie prawdziwej odpowiedzi. Host może przyciskiem „Wymuś dalej" przyspieszyć rundę.</p><p>${gk('Po co:')} to zabawa ze znajomymi, a za dobre miejsce dostajesz coiny.</p>`},
{id:'duel',i:'⚔️',t:'Pojedynek 1 na 1',b:`<p>${gk('Co to:')} gra dwóch osób. Działa tylko dla graczy zalogowanych przez Google.</p><p>${gk('Jak:')} w zakładce Graj dotknij „Pojedynek", wybierz kategorię i liczbę rund, znajdź rywala na liście (najpierw ostatnio aktywni) i kliknij „Wyzwij". Rywal dostaje okno z zaproszeniem, które możesz przyjąć albo odrzucić.</p><p>${gk('Nagroda:')} wygrany dostaje +2 🪙. Przy remisie nikt nic nie dostaje. Jeśli rywal wyjdzie z gry, wygrywasz walkowerem. Wygrane pojedynki liczą się do osobnego rankingu.</p><p>${gk('Po co:')} szybka rywalizacja jeden na jednego.</p>`},
{id:'help',i:'🧰',t:'Ułatwienia i koło fortuny',b:`<p>${gk('Co to:')} trzy jednorazowe ułatwienia, których używasz podczas głosowania, pod odpowiedziami:</p><ul><li>💡 ${gk('Podpowiedź:')} ukrywa połowę błędnych odpowiedzi.</li><li>🕵️ ${gk('Podmiana:')} przenosi na Ciebie punkty za najpopularniejszy fejk w tej rundzie.</li><li>🚫 ${gk('Blokada:')} wybranemu graczowi odbiera ułatwienia i punkty za prawdę w tej rundzie.</li></ul><p>${gk('Skąd je wziąć:')} w Fake it, w zakładce Ułatwienia, jest koło fortuny. Zakręcenie kosztuje 4 🪙. Najczęściej wypada pusto (ok. 70%), czasem +2 albo +5 🪙, a bardzo rzadko ułatwienie: podpowiedź ok. 5%, podmiana 3,5%, blokada 1,5%.</p><p>${gk('Po co:')} dają przewagę taktyczną i zmieniają przebieg rundy.</p>`},
{id:'coins',i:'🪙',t:'Coiny: skąd i na co',b:`<p>${gk('Skąd:')}</p><ul><li>Codziennie +1 🪙 za wejście do gry (Daily).</li><li>Prezenty za serię dni: 7 dni +5, 14 dni +10, 21 dni +15, 28 dni +20 🪙.</li><li>Po grze za miejsce: 1. miejsce 5 🪙, 2. miejsce 3, 3. miejsce 2, dalsze 1. Do tego +1 za każde 4 wkręcone osoby (maks. +3) i +1 za nos do prawdy (znalezienie prawdy w co najmniej 60% rund). W grze z samymi botami nagroda jest o połowę mniejsza.</li><li>Za każde nowe osiągnięcie +1 🪙.</li><li>Za wygrany pojedynek +2 🪙.</li></ul><p>${gk('Na co:')} paczki kart (12 🪙), koło fortuny (4 🪙) i karty tygodnia (od 30 🪙).</p><p>${gk('Po co:')} coiny są wspólne dla wszystkich gier, więc zdobywasz je w jednej, a wydajesz w dowolnej.</p>`},
{id:'streak',i:'🔥',t:'Daily i seria dni',b:`<p>${gk('Co to:')} za każde dzienne wejście do gry dostajesz +1 🪙, a gdy wchodzisz dzień po dniu, rośnie Twoja seria.</p><p>${gk('Jak:')} kropki na karcie „Tak trzymaj!" pokazują postęp do najbliższego prezentu (co 7 dni). Kalendarz tygodnia w Profilu pokazuje, w które dni grałeś. Seria zeruje się, gdy opuścisz dzień, i zaczyna od nowa z początkiem każdego miesiąca.</p><p>${gk('Po co:')} to prosty powód, żeby wpadać codziennie, a prezent za 28 dni jest największy.</p>`},
{id:'cards',i:'🃏',t:'Karty i kolekcja',b:`<p>${gk('Co to:')} 220 kolekcjonerskich kart z zwierzakami w 5 rzadkościach po 44 karty: Zwykła, Rzadka, Epicka, Legendarna i Mityczna.</p><p>${gk('Jak zdobyć:')} w Sklepie kupisz paczkę (12 🪙, 5 kart). Szanse na pojedynczą kartę: zwykła 66%, rzadka 22%, epicka 8,5%, legendarna 3%, mityczna 0,5%. Karty kupisz też jako karty tygodnia.</p><p>${gk('Wartość:')} zmienia się z dnia na dzień i zależy od tego, ilu graczy ma daną kartę. Im mniej osób ją ma, tym jest cenniejsza. W zakładce Karty widzisz wykres wartości całej kolekcji i możesz filtrować po rzadkości oraz po zdobytych kartach.</p><p>${gk('Po co:')} kolekcjonowanie, ranking wartości kart i handel.</p>`},
{id:'weekly',i:'🛍️',t:'Karty tygodnia',b:`<p>${gk('Co to:')} trzy karty w Sklepie, tylko dla Ciebie. Każdy gracz ma inne, a zmieniają się co poniedziałek.</p><p>${gk('Jak kupić:')} cena zależy od rzadkości: zwykła 30, rzadka 75, epicka 180, legendarna 450, mityczna 1200 🪙. Pasek pokazuje, ile coinów już uzbierałeś, a przycisk „Kup" włączy się, gdy będziesz mieć całą sumę. Pod kartą zobaczysz, czy już ją masz i w ilu sztukach. Każdą z trzech kart możesz kupić raz w tygodniu.</p><p>${gk('Po co:')} pozwala celowo zdobyć kartę, której szukasz, zamiast liczyć na szczęście w paczce.</p>`},
{id:'trade',i:'🔁',t:'Handel kartami',b:`<p>${gk('Co to:')} wymiana kart z innymi graczami.</p><p>${gk('Jak:')} wejdź w Karty i „Handel kartami". Wybierz kartę, którą oddajesz, oraz rzadkość i zwierzę, które chcesz dostać. Wystawiona karta trafia do depozytu i znika z kolekcji do czasu wymiany. Możesz anulować ofertę, a karta wróci do Ciebie. Oferty innych graczy widzisz niżej, a przycisk „Wymień" włącza się, gdy masz kartę, której ktoś szuka. Po wymianie karta trafia do Ciebie automatycznie.</p><p>${gk('Po co:')} to sposób na uzupełnienie kolekcji bez wydawania coinów.</p>`},
{id:'ach',i:'🎖️',t:'Osiągnięcia, trofea i poziom',b:`<p>${gk('Osiągnięcia:')} w Profilu na górze widzisz ikony zdobytych, a przycisk „Pokaż wszystkie osiągnięcia" rozwija pełną listę. Osiągnięcia mają 4 stopnie (brązowe, srebrne, złote, diamentowe), a za każde dostajesz +1 🪙.</p><p>${gk('Trofea:')} dostajesz je za sumę zdobytych punktów: Brąz 150, Srebro 300, Złoto 500, Platyna 650, Diament 800, Szmaragd 1000, Rubin 1400, Tęczowy 1500, Legendarny 2500.</p><p>${gk('Poziom:')} to liczba zdobytych trofeów plus 1.</p><p>${gk('Po co:')} trofea i komplety osiągnięć odblokowują kolory nicku w Profilu.</p>`},
{id:'rank',i:'🏅',t:'Ranking',b:`<p>${gk('Co to:')} listy najlepszych graczy.</p><p>${gk('Gdzie:')} w menu głównym dotknij karty „Gracze", aby zobaczyć ranking coinów i wartości kart. W grze, w zakładce Ranking, zobaczysz wygrane i pojedynki w tej grze.</p><p>${gk('Uwaga:')} w rankingu pojawiają się tylko gracze zalogowani przez Google. Konto gościa nie trafia do rankingu.</p>`},
{id:'profile',i:'👤',t:'Profil, ramki i motywy',b:`<p>${gk('Profil:')} ustawisz tu zdjęcie z galerii albo emoji, nick i jego kolor (odblokowują go trofea i komplety osiągnięć), dźwięki oraz motyw wyglądu. Możesz też się wylogować.</p><p>${gk('Motywy:')} Neonowy (domyślny), Ciemny, Jasny, Kolorowy, Retro, Królewski oraz Różowy pudrowy w wersji jasnej i ciemnej.</p><p>${gk('Ramki:')} sekcja „Ramki awatara" w Profilu. Dotknij ramki, żeby ją założyć, albo „Bez ramki", żeby ją zdjąć. Ramka Halloween należy się graczom, którzy założyli konto przed 1 listopada 2026. Ramkę widzą też inni w grze i w rankingu.</p><p>${gk('Konto:')} gość traci statystyki po wyczyszczeniu przeglądarki i nie trafia do rankingu. Konto Google zachowuje postęp i daje dostęp do rankingu oraz pojedynków.</p>`},
{id:'upd',i:'📋',t:'Aktualizacje',b:`<p>${gk('Co to:')} lista zmian w grze.</p><p>${gk('Jak:')} zakładka „Zmiany" w menu głównym pokazuje wpisy ze wszystkich gier. W samej grze jest własna zakładka tylko z jej zmianami. Gdy pojawi się nowa aktualizacja, na środku ekranu wyskoczy okno z opisem. Zamykasz je przyciskiem „OK" albo „✕". Kropka na dzwonku 🔔 przypomina o nowościach.</p>`},
{id:'cred',i:'🎬',t:'Napisy końcowe',b:`<p>${gk('Gdzie:')} Profil, na samym dole, przycisk „Napisy końcowe". Kto stworzył grę, kto ją testował i podziękowania.</p>`}

gset('hitster',`<p>${gk('Co to:')} gra muzyczna. Słuchasz fragmentu piosenki i układasz ją na swojej osi czasu we właściwym miejscu według roku wydania.</p><p>${gk('Jak grać:')} na początku masz jedną kartę z rokiem. Gdy jest Twoja kolej, dotknij „Odtwórz utwór”, posłuchaj i wybierz „Wstaw tutaj” w miejscu, gdzie według Ciebie pasuje piosenka. Oś czasu jest ułożona od najnowszych (na górze) do najstarszych (na dole). Trafisz, a karta ląduje na Twojej osi. Pomylisz się, a karta przepada i kolej przechodzi dalej. Wygrywa pierwszy, kto zbierze ustaloną liczbę kart (5, 7 lub 10).</p><p>${gk('Kolory osi:')} każdy gracz ma inny kolor osi czasu, a boty mają kolor niebieski.</p><p>${gk('Pokoje:')} stwórz własny pokój (publiczny lub z kodem), dołącz kodem albo z listy, albo użyj „Szybkiego startu z botami”. W lobby jest czat, dodawanie botów i wyrzucanie graczy.</p><p>${gk('Pojedynek 1 na 1:')} w zakładce Graj dotknij „Wyzwij gracza”, wybierz rywala z listy i poczekaj, aż przyjmie zaproszenie. Gra startuje od razu, a wygrywa pierwszy z 5 kartami. Rywal widzi zaproszenie, gdy jest w zakładce Graj w Hitsterze.</p><p>${gk('Osiągnięcia:')} Hitster ma własne osiągnięcia (gry, wygrane, trafienia, serie, polski rap i pojedynki). Za każde dostajesz +1 🪙.</p><p>${gk('Dźwięk:')} fragment piosenki jest pobierany z darmowego podglądu iTunes. Jeśli któryś utwór się nie załaduje, użyj przycisku „Inny utwór” (raz na turę). Na iPhonie dotknij „Odtwórz utwór” bezpośrednio, a dźwięk uruchomi się od razu.</p><p>${gk('Nagrody:')} wygrany dostaje +2 🪙, pozostali +1 🪙, a gra zapisuje się w kalendarzu w Profilu.</p>`);
